[package]
name = "agentcal"
version = "0.1.0"
edition = "2021"
description = "A calendar engine built for agents — no GUI, no HTTP, libSQL-backed store."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util"] }
libsql = "0.9"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
